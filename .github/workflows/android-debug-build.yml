name: Build Android Device Agent (debug APK)

# Builds the V0 debug APK in GitHub's cloud runners and attaches it as a
# downloadable artifact — the practical build path when developing from
# a phone with no local Android Studio. Trigger manually from the
# GitHub Actions tab ("Run workflow"), or it runs on every push that
# touches android/.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write local.properties from repo variables/secrets
        run: |
          cat > local.properties <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-agent-device-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
